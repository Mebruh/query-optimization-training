<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Query Optimization TRAINing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="boot" id="boot">
    <p class="boot__text">Loading</p>
  </div>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="devbar" id="devbar" hidden>
    <span id="devPid">pid: —</span>
    <span id="devScreen">screen: —</span>
    <span id="devCount">events: 0</span>
    <button type="button" id="devExport">Download CSV</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
